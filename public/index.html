<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RenewAlert</title>
<style>
  :root { --b:#000; --w:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--w); color:var(--b); font:17px/1.5 "Helvetica Neue", Arial, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:56px 24px 80px; }
  h1 { font-size:44px; line-height:1; margin:0 0 40px; font-weight:900; letter-spacing:-1.5px; }
  label { display:block; font-weight:700; margin:20px 0 6px; }
  input, select { width:100%; padding:12px; font:inherit; color:var(--b); background:var(--w); border:1px solid var(--b); border-radius:0; }
  input::placeholder { color:var(--b); opacity:1; }
  input:focus, select:focus, button:focus-visible { outline:3px solid var(--b); outline-offset:2px; }
  fieldset { border:0; padding:0; margin:0; min-width:0; }
  button { margin-top:28px; width:100%; padding:14px; font:inherit; font-weight:700; color:var(--w); background:var(--b); border:2px solid var(--b); border-radius:0; cursor:pointer; }
  button:hover { color:var(--b); background:var(--w); }
  button.alt { margin-top:12px; }
  #msg { margin-top:20px; padding:12px; border:2px solid var(--b); font-weight:700; }
  #msg.ok { background:var(--b); color:var(--w); }
  #preview { margin-top:24px; padding:20px; border:1px solid var(--b); white-space:pre-wrap; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>RenewAlert</h1>

  <form id="login">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
  </form>

  <form id="send" hidden>
    <label for="type">Email type</label>
    <select id="type">
      <option value="reminder">Payment reminder</option>
      <option value="order">Order confirmation</option>
    </select>

    <label for="to">Recipient email</label>
    <input id="to" type="email" placeholder="name@example.com" required>

    <fieldset id="f-pay">
      <label for="amount">Amount due (AED)</label>
      <input id="amount" type="number" step="0.01" min="0.01" placeholder="40.00" required>
      <label for="reason">Reason</label>
      <input id="reason" type="text" maxlength="200" placeholder="Netflix subscription" required>
      <label for="due">Due date</label>
      <input id="due" type="date" required>
      <label for="next">Next payment date</label>
      <input id="next" type="date" required>
    </fieldset>

    <fieldset id="f-order" hidden disabled>
      <label for="cname">Customer name (optional)</label>
      <input id="cname" type="text" maxlength="100" placeholder="Ahmed">
      <label for="ono">Order number (optional, 1 to 6000)</label>
      <input id="ono" type="number" step="1" min="1" max="6000" placeholder="Leave blank for a random one">
      <label for="item">Item</label>
      <input id="item" type="text" maxlength="200" placeholder="Dragon figurine" required>
      <label for="qty">Quantity</label>
      <input id="qty" type="number" step="1" min="1" max="1000" value="1" required>
      <label for="price">Price (AED, or write Free)</label>
      <input id="price" type="text" maxlength="40" placeholder="40.00 or Free" required>
      <label for="prio">Priority delivery (optional)</label>
      <input id="prio" type="text" maxlength="40" placeholder="15 or Free">
      <label for="prep">Preparation (optional)</label>
      <input id="prep" type="text" maxlength="40" placeholder="10 or Free">
    </fieldset>

    <button type="button" id="prev">Preview email</button>
    <div id="preview" hidden></div>
    <button type="submit" class="alt">Send email</button>
    <button type="button" id="out" class="alt">Log out</button>
  </form>

  <div id="msg" hidden role="status"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const msg = $("msg");
const say = (t, ok) => { msg.textContent = t; msg.className = ok ? "ok" : ""; msg.hidden = false; };
const fmt = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric", timeZone:"UTC" });
const today = () => new Date().toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric", timeZone:"Asia/Dubai" });
const money = (v) => {
  const s = String(v || "").trim();
  const n = s.replace(/^AED\s*/i, "").replace(/,/g, "");
  if (/^\d+(\.\d{1,2})?$/.test(n)) return { label: "AED " + Number(n).toFixed(2), value: Number(n) };
  return { label: s, value: 0 };
};
const randomNo = () => Math.floor(1 + Math.random() * 6000);
let autoNo = randomNo();
const orderNo = () => ($("ono").value ? parseInt($("ono").value, 10) : autoNo);
const isOrder = () => $("type").value === "order";
const show = () => { const t = sessionStorage.getItem("ra"); $("login").hidden = !!t; $("send").hidden = !t; };
const sync = () => {
  const o = isOrder();
  $("f-pay").hidden = o; $("f-pay").disabled = o;
  $("f-order").hidden = !o; $("f-order").disabled = !o;
  $("preview").hidden = true;
};
show();
$("type").addEventListener("change", sync);

$("login").addEventListener("submit", async (e) => {
  e.preventDefault(); msg.hidden = true;
  const r = await fetch("/.netlify/functions/login", { method:"POST", body: JSON.stringify({ password: $("pw").value }) });
  const d = await r.json();
  if (!r.ok) return say(d.error, false);
  sessionStorage.setItem("ra", d.token); $("pw").value = ""; show();
});

$("prev").addEventListener("click", () => {
  if (!$("send").reportValidity()) return;
  if (isOrder()) {
    const qty = parseInt($("qty").value, 10);
    const p = money($("price").value), d = money($("prio").value), r = money($("prep").value);
    const total = (p.value + d.value + r.value).toFixed(2);
    const name = $("cname").value.trim();
    let t = `Subject: Order Confirmation\n\n${name ? "Hi " + name + "," : "Hello,"}\n\nThank you for your purchase at 3D Hub. We will ship your order as soon as possible.\n\nReceipt\nOrder number: #${orderNo()}\nDate: ${today()}\nItem: ${$("item").value}\nQuantity: ${qty}\nPrice: ${p.label}`;
    if (d.label) t += `\nPriority delivery: ${d.label}`;
    if (r.label) t += `\nPreparation: ${r.label}`;
    t += `\nTotal: AED ${total}\n\nKind regards,\n3D Hub`;
    $("preview").textContent = t;
  } else {
    const amt = "AED " + Number($("amount").value).toFixed(2), due = fmt($("due").value), next = fmt($("next").value);
    $("preview").textContent = `Subject: Payment Reminder: ${amt} Due on ${due}\n\nDear Customer,\n\nThis is a formal reminder regarding your payment.\n\nAmount due: ${amt}\nReason: ${$("reason").value}\nDue date: ${due}\nNext payment date: ${next}\n\nPlease ensure that payment is made on or before the due date. The following payment will be due on ${next}.\n\nKind regards,\nRenewAlert`;
  }
  $("preview").hidden = false;
});

$("send").addEventListener("submit", async (e) => {
  e.preventDefault(); msg.hidden = true;
  const body = isOrder()
    ? { type: "order", token: sessionStorage.getItem("ra"), to: $("to").value, name: $("cname").value, item: $("item").value, qty: $("qty").value, price: $("price").value, priority: $("prio").value, prep: $("prep").value, orderNo: orderNo() }
    : { type: "reminder", token: sessionStorage.getItem("ra"), to: $("to").value, amount: $("amount").value, reason: $("reason").value, dueDate: $("due").value, nextDate: $("next").value };
  const r = await fetch("/.netlify/functions/send", { method:"POST", body: JSON.stringify(body) });
  const d = await r.json();
  if (r.status === 401) { sessionStorage.removeItem("ra"); show(); }
  if (!r.ok) return say(d.message, false);
  say("Sent to " + $("to").value, true);
  $("send").reset(); autoNo = randomNo(); sync();
});

$("out").addEventListener("click", () => { sessionStorage.removeItem("ra"); msg.hidden = true; show(); });
</script>
</body>
</html>
